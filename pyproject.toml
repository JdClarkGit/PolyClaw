[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "polyclaw"
version = "1.0.0"
description = "AI Trading Intelligence for Polymarket - Your personal prediction market assistant"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "JdClarkGit", email = "polyclaw@example.com"}
]
keywords = [
    "polymarket",
    "prediction-markets", 
    "trading",
    "ai",
    "assistant",
    "analytics",
    "whale-tracking",
    "strategy",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Framework :: Flask",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "flask>=3.0.0",
    "flask-cors>=4.0.0",
    "flask-socketio>=5.3.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "anthropic>=0.18.0",
    "openai>=1.12.0",
    "pandas>=2.0.0",
    "numpy>=1.25.0",
    "aiohttp>=3.9.0",
    "openpyxl>=3.1.0",
    "python-telegram-bot>=21.0",
    "discord.py>=2.3.0",
    "rich>=13.7.0",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
]
analysis = [
    "scipy>=1.11.0",
    "matplotlib>=3.8.0",
    "plotly>=5.18.0",
    "seaborn>=0.13.0",
    "statsmodels>=0.14.0",
    "scikit-learn>=1.3.0",
    "ta>=0.11.0",
]

[project.urls]
Homepage = "https://github.com/JdClarkGit/PolyClaw"
Documentation = "https://github.com/JdClarkGit/PolyClaw/tree/main/docs"
Repository = "https://github.com/JdClarkGit/PolyClaw"
Issues = "https://github.com/JdClarkGit/PolyClaw/issues"
Changelog = "https://github.com/JdClarkGit/PolyClaw/blob/main/CHANGELOG.md"

[project.scripts]
polyclaw = "cli:main"

[tool.setuptools]
packages = ["agents", "channels", "hooks", "knowledge", "memory", "scanner", "skills", "strategies", "tools", "workspace"]

[tool.setuptools.package-data]
"*" = ["*.html", "*.md", "*.json"]

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311', 'py312']

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
